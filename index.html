<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deko Trading Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h1>DEKO TRADING</h1>
        <p>Dashboard Premium</p>
    </aside>

    <main class="main">
        <section class="top-cards">
            <div class="card">Trader Score<br><strong>78/100</strong></div>
            <div class="card">Acertabilidad<br><strong>84%</strong></div>
            <div class="card">Efectividad<br><strong>71%</strong></div>
        </section>

        <section class="summary">
            <h2>Resumen del Mes</h2>
            <ul>
                <li>Días operados: 18</li>
                <li>Días positivos: 9</li>
                <li>Días negativos: 5</li>
                <li>Break Even: 4</li>
                <li>Racha actual: 7 días</li>
                <li>Puntos ganados: +28R</li>
                <li>Puntos perdidos: -9R</li>
            </ul>
        </section>
    </main>
</div>
</body>
</html>
